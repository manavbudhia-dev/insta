<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queue · Autopilot for LinkedIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090c27;--card:#10143a;--line:#232a5c;--line2:#2c3470;--text:#eef0ff;--muted:#9aa3cc;--dim:#4d5594;--v:#7c5cff;--vtext:#a58bff;--green:#22d58b;--red:#ff5d78;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:400 15px/1.45 Inter,"Segoe UI",system-ui,sans-serif;background:radial-gradient(900px 500px at 8% 105%,rgba(95,60,230,.28),transparent 70%),radial-gradient(800px 420px at 95% -10%,rgba(60,70,200,.18),transparent 70%),linear-gradient(180deg,#0b0e2e,#080a22 60%,#0a0b28);background-attachment:fixed}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--vtext);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1480px;margin:0 auto;padding:20px 24px 40px}
.row{display:flex;align-items:center}

/* ---------- header ---------- */
header{justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{gap:20px}
.logo{width:54px;height:54px;border-radius:15px;background:linear-gradient(145deg,#8a66ff,#5b3ee0);display:grid;place-items:center;box-shadow:0 8px 24px rgba(108,76,241,.4)}
.logo svg{width:27px;height:27px;stroke:#fff;stroke-width:1.6}
h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:15.5px}
.right{gap:20px}
.user{gap:12px;height:50px;padding:0 16px 0 12px;border-radius:14px;border:1px solid var(--line);background:rgba(20,25,68,.7)}
.user .av{width:36px;height:36px}
.user span{font-size:14.5px;font-weight:500}
.user svg.i{width:16px;height:16px;color:var(--muted)}
.signout{height:50px;padding:0 24px;border-radius:12px;border:1px solid #3a4285;background:transparent;font-weight:600;font-size:15.5px}
.signout:hover{background:rgba(124,92,255,.12)}
.av{border-radius:50%;overflow:hidden;flex:none;background:#c9ced8}
.av.init{display:grid;place-items:center;background:linear-gradient(145deg,#8a66ff,#5b3ee0);color:#fff;font-weight:700}

/* ---------- week strip ---------- */
.week{margin-top:20px;border:1px solid var(--line);border-radius:20px;background:rgba(16,20,58,.72);padding:8px;overflow-x:auto}
.days{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));flex:1}
.day{background:none;border:1px solid transparent;border-radius:14px;padding:12px 8px 12px;text-align:center;position:relative;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day:not(:last-child):not([aria-pressed=true])::after{content:"";position:absolute;right:0;top:20%;height:60%;width:1px;background:var(--line)}
.day .dn{color:var(--muted);font-size:14px}
.day .num{font-size:22px;font-weight:700;min-width:34px;height:30px;display:grid;place-items:center;border-radius:9px;margin:2px 0}
.day .ct{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.day .ct::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dim)}
.day.has .ct::before{background:var(--v)}
.day[aria-pressed=true]{border-color:#6b4ff0;background:linear-gradient(180deg,rgba(100,76,240,.34),rgba(60,48,160,.3));box-shadow:0 0 0 1px rgba(124,92,255,.25),0 6px 22px rgba(90,60,230,.25)}
.day[aria-pressed=true] .num{background:var(--v);box-shadow:0 0 14px rgba(124,92,255,.7)}
.day[aria-pressed=true] .dn,.day[aria-pressed=true] .ct{color:#d9d4ff}
.day:not([aria-pressed=true]):hover{background:rgba(124,92,255,.08)}
.nav{margin:0 16px;border:1px solid var(--line2);border-radius:12px;height:44px;overflow:hidden;flex:none;background:rgba(14,18,54,.6)}
.nav button{background:none;border:0;height:100%;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500}
.nav button:hover{background:rgba(124,92,255,.12)}
.nav button svg.i{width:17px;height:17px;color:var(--muted)}
.nav .mid{border-left:1px solid var(--line2);border-right:1px solid var(--line2);padding:0 16px}

/* ---------- tabs ---------- */
.tabs{margin-top:20px;gap:8px;border-bottom:1px solid var(--line);padding-bottom:1px;overflow-x:auto}
.tab{background:none;border:1px solid transparent;border-radius:999px;height:50px;padding:0 24px;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:500;color:#c7cdee;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected=true]{border-color:#6b4ff0;background:linear-gradient(180deg,rgba(105,78,245,.3),rgba(60,45,170,.3));color:var(--vtext);font-weight:600;box-shadow:0 0 18px rgba(100,70,240,.25)}
.tab svg.i{width:22px;height:22px}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:20px;margin-top:28px;align-items:start}
.ph{justify-content:space-between;align-items:flex-start;gap:16px}
.ph h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.ph p{margin:8px 0 0;color:var(--muted);font-size:16px}
.create{height:48px;padding:0 24px;border-radius:11px;border:0;background:linear-gradient(180deg,#6a4cf4,#5a3fe6);color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;gap:12px;box-shadow:0 8px 22px rgba(94,64,235,.4);white-space:nowrap}
.create:hover{background:linear-gradient(180deg,#7656ff,#6344ee)}
.create svg.i{width:20px;height:20px;stroke-width:2}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:24px 0 20px}
.stat{display:flex;align-items:center;gap:16px;height:72px;padding:0 16px;text-align:left;border:1px solid var(--line);border-radius:14px;background:rgba(16,20,58,.7);transition:border-color .15s}
.stat:hover{border-color:var(--line2)}
.stat .ib{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.stat .ib svg.i{width:24px;height:24px;stroke-width:1.7}
.stat b{display:block;font-size:20px;line-height:1.15;font-weight:700}
.stat small{color:var(--muted);font-size:14px}
.stat.on{border-color:#6b4ff0;background:linear-gradient(180deg,rgba(100,76,240,.2),rgba(60,48,160,.16));box-shadow:0 0 0 1px rgba(124,92,255,.18),0 6px 20px rgba(90,60,230,.18)}
.t-up{background:rgba(108,76,241,.3);color:#b9a6ff}
.t-dr{background:rgba(150,160,210,.14);color:#c3c9ee}
.t-pu{background:rgba(34,213,139,.14);color:#3ee0a0}
.t-fa{background:rgba(255,93,120,.14);color:#ff6a80}

/* filter row */
.fr{display:flex;gap:8px;flex-wrap:nowrap;align-items:center}.fr .dd{flex:none}@media (max-width:760px){.fr{flex-wrap:wrap}.srch{flex:1 1 100%}}.fchip{margin:12px 0 0}
.seg{display:flex;border:1px solid var(--line2);border-radius:12px;height:42px;background:rgba(9,12,40,.5);overflow:hidden;max-width:100%;overflow-x:auto}
.seg button{background:none;border:0;padding:0 12px;height:100%;font-size:14px;font-weight:500;color:#c7cdee;white-space:nowrap;position:relative}
.seg button+button::before{content:"";position:absolute;left:0;top:25%;height:50%;width:1px;background:var(--line)}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#6a4cf4,#5a3fe6);color:#fff;font-weight:600;border-radius:11px}
.seg button[aria-pressed=true]::before,.seg button[aria-pressed=true]+button::before{display:none}
.seg button:not([aria-pressed=true]):hover{color:#fff}
.srch{flex:1 1 100px;min-width:100px;display:flex;align-items:center;gap:12px;height:42px;padding:0 16px;border:1px solid var(--line2);border-radius:12px;background:rgba(9,12,40,.5);color:var(--muted)}
.srch:focus-within{border-color:#6b4ff0}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14.5px;color:var(--text)}
.srch input::placeholder{color:#7a82ae}
.srch svg.i{width:18px;height:18px}
.dd{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border:1px solid var(--line2);border-radius:12px;background:rgba(9,12,40,.5);font-size:14px;font-weight:500;white-space:nowrap}
.dd:hover{border-color:#4a53a8}
.dd svg.i{width:18px;height:18px;color:#c2c8ec}
.dd svg.i:last-child{width:15px;height:15px;color:var(--muted)}
.dd.sm{height:36px;border-radius:11px;font-size:14px;padding:0 12px}

.chip{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 8px 8px 16px;border-radius:999px;border:1px solid #5b44e0;background:rgba(100,76,240,.2);font-size:14px;color:#d9d4ff}
.chip button{background:none;border:0;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#d9d4ff}
.chip button:hover{background:rgba(255,255,255,.14)}
.chip svg.i{width:14px;height:14px;stroke-width:2.2}

.bulk{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:16px;padding:12px 16px;border:1px solid #5b44e0;border-radius:14px;background:rgba(100,76,240,.16)}
.bulk strong{font-weight:600}
.bulk .sp{flex:1}
.lnk{background:none;border:0;padding:8px 12px;border-radius:8px;font-size:14.5px;font-weight:500;color:var(--vtext)}
.lnk:hover{background:rgba(124,92,255,.16)}
.lnk.red{color:#ff7a8c}.lnk.red:hover{background:rgba(255,93,120,.14)}

/* ---------- post cards ---------- */
#list{display:grid;gap:16px;margin-top:16px}
.pc{display:grid;grid-template-columns:30px minmax(0,1fr) 132px 30px;column-gap:16px;row-gap:12px;padding:16px 16px 12px 20px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(18,22,66,.7),rgba(13,17,52,.78))}
.pc:hover{border-color:var(--line2)}
.pc.sel{border-color:#5b44e0;background:linear-gradient(180deg,rgba(40,34,110,.55),rgba(20,20,66,.7))}
.ck{grid-column:1;grid-row:1;align-self:center;position:relative;width:22px;height:22px;display:block}
.ck input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.ck span{pointer-events:none;position:absolute;inset:0;border:1.5px solid #4a53a8;border-radius:6px;background:rgba(9,12,40,.6);display:grid;place-items:center}
.ck input:checked+span{background:#6a4cf4;border-color:#6a4cf4}
.ck input:checked+span::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck input:focus-visible+span{outline:2px solid var(--vtext);outline-offset:2px}
.hd{grid-column:2;grid-row:1;display:flex;align-items:center;gap:24px;min-width:0;flex-wrap:wrap}
.au{display:flex;align-items:center;gap:12px;min-width:0}
.avw{position:relative;flex:none;width:46px;height:46px}
.avw .av{width:46px;height:46px;font-size:16px}
.lib{background:#0a66c2;color:#fff;font:700 9px/1 Arial,sans-serif;border-radius:3px;display:grid;place-items:center;width:15px;height:15px;flex:none;letter-spacing:-.3px}
.avw .lib{position:absolute;right:-3px;bottom:-1px;width:17px;height:17px;border:2px solid #121648;border-radius:5px;font-size:12px;box-sizing:content-box;width:13px;height:13px}
.nm{font-weight:700;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;margin-top:2px;white-space:nowrap}
.pf .lib{width:14px;height:14px;font-size:12px}
.dt{display:flex;align-items:flex-start;gap:8px;color:var(--muted)}
.dt svg.i{width:17px;height:17px;margin-top:2px}
.dt b{display:block;color:#fff;font-weight:500;font-size:14px;line-height:1.3;white-space:nowrap}
.dt small{display:block;font-size:13px;line-height:1.3;margin-top:1px;white-space:nowrap}
.pill{height:28px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;font-size:13.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.s-scheduled{background:rgba(108,84,255,.36);color:#ebe7ff;border-color:rgba(140,115,255,.4)}
.s-published{background:rgba(34,213,139,.14);color:#3ee0a0;border-color:rgba(34,213,139,.3)}
.s-draft{background:rgba(150,160,210,.16);color:#c9cef0;border-color:rgba(150,160,210,.22)}
.s-failed{background:rgba(255,93,120,.14);color:#ff7a8c;border-color:rgba(255,93,120,.3)}
.s-publishing{background:rgba(255,184,76,.14);color:#ffc766;border-color:rgba(255,184,76,.3)}
.tx{grid-column:2;grid-row:2;margin:0;font-size:16px;line-height:1.5;color:#f1f2ff;white-space:pre-line;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.th{grid-column:3;grid-row:1/3;align-self:start;position:relative;width:132px;height:88px;border-radius:10px;overflow:hidden;background:#1a1d58}
.th svg,.th img,.th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.th .pl{display:none;position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(10,12,42,.7);place-items:center;border:1px solid rgba(255,255,255,.4)}
.th .pl::after{content:"";border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.th video~.pl{display:grid}
.th .tag{position:absolute;left:6px;bottom:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(10,12,42,.78);color:#e6e2ff}
.kb{background:none;border:0;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#c2c8ec}
.kb:hover,.kb[aria-expanded=true]{background:rgba(124,92,255,.18);color:#fff}
.kb.t{grid-column:4;grid-row:1;align-self:start;margin-top:-2px}
.ft{grid-column:2/5;grid-row:3;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:34px}
.acts{display:flex;align-items:center;gap:4px;margin-left:auto}
.acts .kb{margin-left:4px}
.ab{background:none;border:0;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:9px;font-size:14.5px;font-weight:500;color:#d7dbf5;white-space:nowrap}
.ab:hover{background:rgba(124,92,255,.15);color:#fff}
.ab svg.i{width:18px;height:18px;color:#c2c8ec}
.ab.red,.ab.red svg.i{color:#ff6a80}.ab.red:hover{background:rgba(255,93,120,.14)}
.ok,.er{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;color:#3ee0a0}
.ok i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.er{color:#ff8a9b;max-width:60%}
.er svg.i{width:17px;height:17px}

.empty{margin-top:16px;border:1px dashed var(--line2);border-radius:16px;padding:44px 20px;text-align:center;background:rgba(16,20,58,.4)}
.empty .ib{width:56px;height:56px;border-radius:16px;margin:0 auto 16px;display:grid;place-items:center;background:rgba(108,76,241,.24);color:#b9a6ff}
.empty .ib svg.i{width:28px;height:28px}
.empty strong{display:block;font-size:18px}
.empty p{margin:8px 0 20px;color:var(--muted)}
.empty .create{margin:0 auto}

/* ---------- overview panel ---------- */
.ov{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(18,22,66,.88),rgba(13,17,52,.9));padding:24px 24px 24px;position:sticky;top:16px}
.ovh{justify-content:space-between;gap:12px}
.ov h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;min-width:0}
.ov .sub{margin:8px 0 0;color:var(--muted);font-size:14.5px}
.cw{display:grid;grid-template-columns:26px 1fr;grid-template-rows:118px auto;gap:0 8px;margin:24px 0 8px}
.yx{position:relative}
.yx span{position:absolute;right:0;transform:translateY(50%);font-size:12.5px;color:var(--muted);line-height:1}
.plot{display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--line2);padding:0 2px}
.plot .c{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.bar{width:min(24px,80%);border-radius:6px 6px 0 0;background:linear-gradient(180deg,#8a66ff,#5f42ee);min-height:0}
.xl{display:flex;gap:4px;padding:8px 2px 0}
.xl span{flex:1;text-align:center;font-size:12.5px;line-height:1.35;color:var(--muted);white-space:nowrap}
.xl span.now{color:#fff;font-weight:600}
.xl span em{display:block;font-style:normal}
.cw>div:nth-child(3){grid-column:1}
.ol{margin-top:16px}
.or{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.or:first-child{border-top:0}
.or .ib{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none}
.or .ib svg.i{width:24px;height:24px;stroke-width:1.7}
.or .n{flex:1;min-width:0}
.or b{display:block;font-size:18px;line-height:1.15;font-weight:700}
.or small{color:var(--muted);font-size:14px}
.va{background:none;border:0;display:flex;align-items:center;gap:8px;color:var(--vtext);font-size:14.5px;font-weight:500;padding:8px 4px;border-radius:8px}
.va:hover{color:#fff}
.va svg.i{width:16px;height:16px;stroke-width:2}
.best{display:flex;align-items:center;gap:16px;width:100%;margin-top:12px;padding:16px 16px;text-align:left;border:1px solid #4a3fc4;border-radius:14px;background:linear-gradient(180deg,rgba(100,76,240,.2),rgba(55,44,160,.16));box-shadow:inset 0 0 22px rgba(100,70,240,.1)}
.best:hover{border-color:#6b4ff0}
.best .ic{width:46px;height:46px;border-radius:50%;background:#252b72;border:1px solid #3a42a0;display:grid;place-items:center;color:#cfd3ff;flex:none}
.best .ic svg.i{width:24px;height:24px}
.best .t{flex:1;min-width:0}
.best strong{display:block;font-size:16.5px;font-weight:700}
.best b{display:block;font-size:13.5px;font-weight:600;margin-top:2px}
.best small{display:block;color:#aeb5da;font-size:12.5px;margin-top:2px}
.best>svg.i{width:20px;height:20px;color:var(--vtext)}

/* ---------- popover + modal + toast ---------- */
#menu{position:fixed;z-index:40;min-width:196px;padding:8px;border:1px solid var(--line2);border-radius:14px;background:#12163f;box-shadow:0 18px 44px rgba(0,0,0,.55)}
#menu button{width:100%;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border:0;border-radius:9px;background:none;font-size:14.5px;font-weight:500;text-align:left;white-space:nowrap}
#menu button:hover,#menu button:focus-visible{background:rgba(124,92,255,.18);outline:0}
#menu button svg.i{width:18px;height:18px;color:#c2c8ec}
#menu button .ck2{margin-left:auto;color:var(--vtext)}
#menu button.red,#menu button.red svg.i{color:#ff7a8c}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 4px}
.mo{position:fixed;inset:0;z-index:50;background:rgba(5,7,26,.72);display:grid;place-items:center;padding:20px}
.md{width:100%;max-width:440px;border:1px solid var(--line2);border-radius:20px;background:linear-gradient(180deg,#151a4d,#0f1340);padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.md h3{margin:0 0 8px;font-size:20px}
.md p{margin:0 0 16px;color:var(--muted)}
.md label{display:block;color:#d2d7f2;font-size:14.5px;font-weight:600;margin:0 0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inp{width:100%;height:48px;border-radius:12px;border:1px solid var(--line2);background:rgba(9,12,40,.8);padding:0 16px;font-size:15.5px;color-scheme:dark}
.inp:focus{border-color:#6b4ff0;outline:0}
.mf{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}

<script>
const $=id=>document.getElementById(id),P=n=>String(n).padStart(2,"0"),DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+P(d.getMonth()+1)+"-"+P(d.getDate());
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>{const x=new Date(d);x.setHours(0,0,0,0);return add(x,-((x.getDay()+6)%7))};
const ic=(n,c="")=>`<svg class="i ${c}"><use href="#${n}"/></svg>`;
const today=new Date(),thisMon=mon(today),md={month:"short",day:"numeric"};
const RANGES=[[7,"Last 7 days"],[30,"Last 30 days"],[90,"Last 90 days"],[0,"All time"]];
const SORTS=[["new","Newest first"],["old","Oldest first"]];
const CRANGES=[[7,"Last 7 days"],[14,"Last 14 days"],[30,"Last 30 days"]];
const FILTERS=[["all","All posts"],["scheduled","Scheduled"],["draft","Drafts"],["published","Published"],["failed","Failed"]];
let posts=[],filter="all",q="",range=30,sort="new",dayF=null,wk=thisMon,sel=iso(add(thisMon,4)),cr=7,picked=new Set(),loaded=false,tt;

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3200)}
async function api(p,o={}){const r=await fetch(p,{method:o.method||"GET",headers:{"Content-Type":"application/json"},body:o.body?JSON.stringify(o.body):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)location.href="/linkedin/classic.html";throw new Error(j.error||"Something went wrong")}return j}

/* ---------- post helpers ---------- */
const grp=p=>p.status==="draft"?"draft":p.status==="published"?"published":p.status==="failed"?"failed":"scheduled";
const key=p=>p.status==="draft"?(p.updated_at||p.created_at||p.when_at):p.status==="published"?(p.published_at||p.when_at):p.when_at;
const counts=()=>{const c={all:posts.length,scheduled:0,draft:0,published:0,failed:0};posts.forEach(p=>c[grp(p)]++);return c};
const time=d=>d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
function relDay(d){const k=iso(d);return k===iso(today)?"Today":k===iso(add(today,1))?"Tomorrow":k===iso(add(today,-1))?"Yesterday":d.toLocaleDateString("en-US",md)}
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return"just now";const m=Math.floor(s/60);if(m<60)return m+(m==1?" minute":" minutes")+" ago";const h=Math.floor(m/60);if(h<24)return h+(h==1?" hour":" hours")+" ago";const d=Math.floor(h/24);return d+(d==1?" day":" days")+" ago"}
const mediaItems=p=>{try{return JSON.parse(p.media_json||"[]")}catch{return[]}};

/* ---------- placeholder artwork (used when a post has no media on the server) ---------- */
const ART=[
`<svg viewBox="0 0 132 88" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2d9a"/><stop offset="1" stop-color="#7c4cf2"/></linearGradient></defs><rect width="132" height="88" fill="url(#ga)"/><circle cx="98" cy="25" r="9" fill="#ece8ff"/><path d="M0 88V60l24-24 18 19 16-13 28 28 46-22v40z" fill="#4636d4"/><path d="M24 36l-8 8 8-3 7 5zM86 70l22-10-22-6z" fill="#8f86ff" opacity=".55"/><path d="M0 88V74l22-13 20 13 24-19 26 22 40-12v23z" fill="#251b86"/></svg>`,
`<svg viewBox="0 0 132 88" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="gb" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#6a3fe8"/><stop offset="1" stop-color="#150f4d"/></radialGradient></defs><rect width="132" height="88" fill="url(#gb)"/><rect x="0" y="70" width="132" height="18" fill="#1b1260"/><rect x="38" y="20" width="58" height="38" rx="3" fill="#0f0f38" stroke="#7a6cff" stroke-width="1.5"/><rect x="43" y="25" width="22" height="3" rx="1.5" fill="#8f86ff"/><rect x="43" y="32" width="14" height="14" rx="2" fill="#5b43e6"/><rect x="60" y="32" width="14" height="14" rx="2" fill="#3a8cff" opacity=".8"/><rect x="77" y="32" width="14" height="14" rx="2" fill="#ff6fa8" opacity=".8"/><rect x="43" y="49" width="40" height="3" rx="1.5" fill="#4a4ca8"/><path d="M30 60h76l6 8H24z" fill="#34308c"/><rect x="8" y="52" width="16" height="18" rx="3" fill="#2a2380"/><path d="M16 52c-7-4-9-12-5-17 5 3 8 9 5 17zM16 52c6-5 10-12 8-17-6 3-9 9-8 17z" fill="#3fd49a"/></svg>`,
`<svg viewBox="0 0 132 88" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18125a"/><stop offset="1" stop-color="#4a34d2"/></linearGradient></defs><rect width="132" height="88" fill="url(#gc)"/><path d="M0 52C26 28 46 72 72 48s40-20 60-4v44H0z" fill="#6a4df0" opacity=".95"/><path d="M0 64C30 44 56 82 86 58s30-8 46 2v28H0z" fill="#8a6bff" opacity=".55"/><path d="M0 74C28 62 52 88 84 70s32-6 48 2v16H0z" fill="#2b1f95" opacity=".9"/></svg>`];
function thumb(p){
 const it=mediaItems(p)[0];let m="";
 if(p.type==="image"&&it)m=`<img src="/linkedin/api/media/${+it.id}" alt="" loading="lazy" onerror="this.remove()">`;
 if(p.type==="video"&&it)m=`<video src="/linkedin/api/media/${+it.id}#t=0.1" preload="metadata" muted playsinline onerror="this.remove()"></video><span class="pl"></span>`;
 const n=mediaItems(p).length,tag=p.type==="poll"?"Poll":p.type==="image"&&n>1?n+" images":"";
 return `<div class="th">${ART[p.id%3]}${m}${tag?`<span class="tag">${tag}</span>`:""}</div>`}

/* ---------- list ---------- */
function visible(){
 const min=range?Date.now()-range*864e5:0,s=q.trim().toLowerCase();
 return posts.filter(p=>{
  if(filter!=="all"&&grp(p)!==filter)return false;
  const k=key(p);if(k<min)return false;
  if(dayF&&iso(new Date(k))!==dayF)return false;
  if(s&&!((p.text||"")+" "+(p.account_name||"")).toLowerCase().includes(s))return false;
  return true}).sort((a,b)=>sort==="new"?key(b)-key(a):key(a)-key(b))}

function actions(p){
 const g=grp(p),b=(a,i,l,c="")=>`<button class="ab ${c}" data-a="${a}">${ic(i)}${l}</button>`;
 if(p.status==="publishing")return"";
 if(g==="scheduled")return b("edit","pen","Edit")+b("dup","copy","Duplicate")+b("resch","hist","Reschedule");
 if(g==="published")return(p.urn?b("view","ext","View post"):"")+b("dup","copy","Duplicate");
 if(g==="draft")return b("edit","pen","Continue editing")+b("del","trash","Delete","red");
 return b("now","refresh","Retry now")+b("edit","pen","Edit")+b("del","trash","Delete","red")}
function card(p){
 const g=grp(p),k=key(p),d=new Date(k),org=p.account_kind==="organization",name=p.account_name||"Removed account";
 const av=org?`<span class="av init">${esc(name.trim().slice(0,1).toUpperCase()||"P")}</span>`:`<svg class="av" viewBox="0 0 64 64"><use href="#face"/></svg>`;
 const l1=g==="draft"?"Last edited "+ago(k):relDay(d)+", "+time(d);
 const l2=d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});
 const label=p.status==="publishing"?"Publishing…":{scheduled:"Scheduled",published:"Published",draft:"Draft",failed:"Failed"}[g];
 const status=g==="published"?`<div class="ok"><i></i>Published successfully</div>`:g==="failed"?`<div class="er">${ic("alert")}<span>${esc(p.error||"Publishing failed")}</span></div>`:"";
 const mine=picked.has(p.id);
 return `<article class="pc${mine?" sel":""}" data-id="${p.id}">
  <label class="ck"><input type="checkbox" data-ck ${mine?"checked":""} aria-label="Select post"><span></span></label>
  <div class="hd">
   <div class="au"><span class="avw">${av}<b class="lib">in</b></span><div style="min-width:0"><div class="nm">${esc(name)}</div><div class="pf"><b class="lib">in</b>${org?"Company page":"Personal profile"}</div></div></div>
   <div class="dt">${ic("cal")}<div><b>${esc(l1)}</b><small>${esc(l2)}</small></div></div>
   <span class="pill s-${p.status==="publishing"?"publishing":g}">${label}</span>${p.ai?'<span class="pill s-ai" title="Written by Auto content">AI</span>':""}
  </div>
  <p class="tx">${esc(p.text)}</p>
  ${thumb(p)}
  <button class="kb t" data-a="menu" aria-label="More actions" aria-haspopup="menu">${ic("dots")}</button>
  <div class="ft">${status}<div class="acts">${actions(p)}<button class="kb" data-a="menu" aria-label="More actions" aria-haspopup="menu">${ic("dots")}</button></div></div>
 </article>`}

function renderList(){
 const v=visible(),box=$("list");
 $("create").style.display=(!posts.length&&loaded)?"none":"";
 if(!v.length){
  const none=!posts.length;
  box.innerHTML=`<div class="empty"><div class="ib">${ic(none?"cal":"search")}</div><strong>${none?"Nothing in your queue yet":"No posts match these filters"}</strong><p>${none?"Posts you schedule or save as drafts will show up here.":"Try another filter, a longer date range or a different search."}</p>${none?`<button class="create" data-a="create">${ic("plus")}Create post</button>`:""}</div>`;return}
 box.innerHTML=v.map(card).join("")}
function renderBulk(){
 const n=picked.size;
 $("bulk").innerHTML=n?`<div class="bulk"><strong>${n} selected</strong><span class="sp"></span><button class="lnk" data-b="all">Select all shown</button><button class="lnk red" data-b="del">Delete selected</button><button class="lnk" data-b="clear">Clear</button></div>`:""}
function renderTop(){
 const c=counts(),accent=filter;
 const S=[["scheduled","Upcoming","calx","t-up"],["draft","Drafts","doc","t-dr"],["published","Published","send","t-pu"],["failed","Failed","alert","t-fa"]];
 $("stats").innerHTML=S.map(([f,l,i,t])=>`<button class="stat${accent===f?" on":""}${f==="failed"&&c[f]>0?" alert":""}" data-f="${f}" aria-pressed="${accent===f}" title="${accent===f?"Click again to show all posts":"Show only "+l.toLowerCase()}"><span class="ib ${t}">${ic(i)}</span><span><b>${c[f]}</b><small>${l}</small></span></button>`).join("");
 $("ddrl").textContent=RANGES.find(r=>r[0]===range)[1];$("ddsl").textContent=SORTS.find(s=>s[0]===sort)[1];$("ddcl").textContent=CRANGES.find(r=>r[0]===cr)[1];
 const dc=$("daychip");const FL={scheduled:"Upcoming",draft:"Drafts",published:"Published",failed:"Failed"};dc.innerHTML=(filter!=="all"?`<span class="chip fchip">Showing ${FL[filter]}<button data-f="all" aria-label="Show all posts">${ic("x")}</button></span> `:"")+(dayF?`<span class="chip">Showing ${new Date(dayF+"T00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}<button data-clearday aria-label="Clear day filter">${ic("x")}</button></span>`:"")}

/* ---------- week strip ---------- */
function renderWeek(){
 const real=posts.filter(p=>p.status!=="draft");
 $("days").innerHTML=[0,1,2,3,4,5,6].map(i=>{const d=add(wk,i),k=iso(d),n=real.filter(p=>iso(new Date(key(p)))===k).length;
  return `<button class="day${n?" has":""}" data-d="${k}" aria-pressed="${k===sel}"><span class="dn">${DN[d.getDay()]}</span><span class="num">${d.toLocaleDateString("en-US",md)}</span><span class="ct">${n} ${n==1?"post":"posts"}</span></button>`}).join("");
 const df=Math.round((wk-thisMon)/6048e5);
 $("wk").textContent=df==0?"This week":df==1?"Next week":df==-1?"Last week":wk.toLocaleDateString("en-US",md)+" – "+add(wk,6).toLocaleDateString("en-US",md)}

/* ---------- chart: posts per day, window ends on the last day of the week shown above ---------- */
function renderChart(){
 const real=posts.filter(p=>p.status!=="draft"),end=add(wk,6),days=[...Array(cr)].map((_,i)=>add(end,i-(cr-1)));
 const v=days.map(d=>real.filter(p=>iso(new Date(key(p)))===iso(d)).length),m=Math.max(...v,0);
 if(!m){$("chart").innerHTML=`<div class="nodata"><p>No posts scheduled or published this week.</p></div>`;return}
 let top=Math.max(2,m),step=top<=3?1:top<=6?2:Math.ceil(top/3/2)*2;top=Math.ceil(top/step)*step;
 const ticks=[];for(let t=0;t<=top;t+=step)ticks.push(t);
 const yx=ticks.map(t=>`<span style="bottom:${t/top*100}%">${t}</span>`).join("");
 const bars=v.map((n,i)=>`<div class="c" title="${n} ${n==1?"post":"posts"} · ${days[i].toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}">${n?`<div class="bar" style="height:${n/top*100}%"></div>`:""}</div>`).join("");
 const lbl=days.map((d,i)=>{const now=iso(d)===iso(today);
  if(cr===7)return `<span class="${now?"now":""}"><em>${DN[d.getDay()]}</em><em>${d.getDate()}</em></span>`;
  const show=cr===14||i%5===(cr-1)%5;return `<span class="${now?"now":""}">${show?`<em>${d.getDate()}</em>`:""}</span>`}).join("");
 $("chart").innerHTML=`<div class="yx">${yx}</div><div class="plot">${bars}</div><div></div><div class="xl">${lbl}</div>`}

/* ---------- best time ---------- */
const bestDay=today.getHours()<10?0:1;
$("bt").textContent=(bestDay?"Tomorrow":"Today")+", 10:00 AM – 12:00 PM";
$("best").onclick=()=>location.href="/linkedin/";

function renderAll(){renderWeek();renderTop();renderBulk();renderList();renderChart()}
function setFilter(f){filter=f;picked.clear();renderTop();renderBulk();renderList()}

/* ---------- popover menu ---------- */
const menu=$("menu");let menuCb=null,menuBtn=null;
function closeMenu(){menu.hidden=true;menuCb=null;if(menuBtn)menuBtn.removeAttribute("aria-expanded");menuBtn=null;flush()}
function openMenu(btn,items,cb){
 if(menuBtn===btn){closeMenu();return}
 closeMenu();menuBtn=btn;menuCb=cb;btn.setAttribute("aria-expanded","true");
 menu.innerHTML=items.map(it=>it==="-"?"<hr>":`<button role="menuitem" data-k="${it.k}" class="${it.red?"red":""}">${it.i?ic(it.i):""}${esc(it.l)}${it.on?`<span class="ck2">${ic("check")}</span>`:""}</button>`).join("");
 menu.hidden=false;
 const r=btn.getBoundingClientRect(),w=menu.offsetWidth,h=menu.offsetHeight;
 let left=Math.min(Math.max(8,r.right-w),innerWidth-w-8),top=r.bottom+6;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-6);
 menu.style.left=left+"px";menu.style.top=top+"px";menu.querySelector("button")?.focus()}
menu.onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const cb=menuCb,k=b.dataset.k;closeMenu();cb&&cb(k)};
document.addEventListener("click",e=>{if(!menu.hidden&&!menu.contains(e.target)&&!e.target.closest("[aria-expanded]"))closeMenu()},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeMenu();closeModal()}});
addEventListener("scroll",closeMenu,true);addEventListener("resize",closeMenu);
const dropdown=(id,opts,cur,set)=>$(id).onclick=e=>openMenu(e.currentTarget,opts.map(([k,l])=>({k,l,on:k===cur()})),k=>set(opts.find(o=>String(o[0])===k)[0]));
dropdown("ddr",RANGES,()=>range,v=>{range=v;renderTop();renderList()});
dropdown("dds",SORTS,()=>sort,v=>{sort=v;renderTop();renderList()});
dropdown("ddc",CRANGES,()=>cr,v=>{cr=v;renderTop();renderChart()});

function postMenu(p){
 const g=grp(p),it=(k,i,l,red)=>({k,i,l,red});
 if(p.status==="publishing")return[it("dup","copy","Duplicate as draft")];
 if(g==="scheduled")return[it("now","bolt","Post now"),it("edit","pen","Edit"),it("dup","copy","Duplicate"),it("resch","hist","Reschedule"),"-",it("del","trash","Delete",1)];
 if(g==="published")return[...(p.urn?[it("view","ext","View on LinkedIn")]:[]),it("dup","copy","Duplicate"),"-",it("del","trash","Remove from queue",1)];
 if(g==="draft")return[it("edit","pen","Continue editing"),it("dup","copy","Duplicate"),"-",it("del","trash","Delete",1)];
 return[it("now","refresh","Retry now"),it("edit","pen","Edit"),it("dup","copy","Duplicate"),it("resch","hist","Reschedule"),"-",it("del","trash","Delete",1)]}

/* ---------- modal ---------- */
let modalOk=null,lastFocus=null;
function openModal({title,body="",ok="Save",danger=false,onOk}){
 lastFocus=document.activeElement;$("mt").textContent=title;$("mb").innerHTML=body;
 const b=$("mok");b.textContent=ok;b.className="btn "+(danger?"danger":"primary");b.disabled=false;modalOk=onOk;$("mo").hidden=false;
 ($("mb").querySelector("input")||b).focus()}
function closeModal(){if($("mo").hidden)return;$("mo").hidden=true;modalOk=null;lastFocus&&lastFocus.focus&&lastFocus.focus();flush()}
$("mc").onclick=closeModal;$("mo").onclick=e=>{if(e.target===$("mo"))closeModal()};
$("mok").onclick=async()=>{if(!modalOk)return;const b=$("mok");b.disabled=true;try{if(await modalOk()!==false)closeModal();else b.disabled=false}catch(e){toast(e.message);b.disabled=false}};

/* ---------- actions ---------- */
/* ---------- live refresh: server pushes an event, we debounce, fetch once, and redraw only if something changed ---------- */
let inflight=false,again=false,pending=false,lastJson="",rt,live=false;
const idle=()=>$("mo").hidden&&menu.hidden;
async function reload(){
 if(inflight){again=true;return}
 inflight=true;
 try{
  const raw=await fetch("/linkedin/api/posts",{cache:"no-store"});
  if(raw.status===401){location.href="/linkedin/classic.html";return}
  const txt=await raw.text();if(!raw.ok)throw new Error("Couldn’t load your queue");
  if(txt!==lastJson||!loaded){
   lastJson=txt;posts=JSON.parse(txt);loaded=true;
   picked.forEach(id=>{if(!posts.some(p=>p.id===id))picked.delete(id)});
   if(idle())renderAll();else pending=true; // don't yank a menu or dialog away; redraw when it closes
  }
 }catch(e){if(!loaded)$("list").innerHTML=`<div class="empty"><strong>Couldn’t load your queue</strong><p>${esc(e.message)}</p></div>`}
 finally{inflight=false;if(again){again=false;reloadSoon()}}}
function reloadSoon(ms=200){clearTimeout(rt);rt=setTimeout(reload,ms)}
function flush(){if(pending&&idle()){pending=false;renderAll()}}
function connect(){
 if(!window.EventSource)return;
 const es=new EventSource("/linkedin/api/events");
 es.onopen=()=>{live=true;reloadSoon(0)};           // (re)connected: catch up on anything missed
 es.addEventListener("posts",()=>reloadSoon());      // post saved, deleted, publishing, published, failed...
 es.onerror=()=>{live=false};                        // browser reconnects by itself; polling below covers the gap
}
connect();

function resched(p){
 const base=p.when_at>Date.now()?new Date(p.when_at):(()=>{const d=add(today,1);d.setHours(10,0,0,0);return d})();
 openModal({title:"Reschedule post",ok:"Reschedule",body:`<p>Pick a new date and time. The post publishes automatically.</p><div class="two"><div><label for="rd">Date</label><input class="inp" type="date" id="rd" min="${iso(today)}" value="${iso(base)}"></div><div><label for="rt">Time</label><input class="inp" type="time" id="rt" value="${P(base.getHours())}:${P(base.getMinutes())}"></div></div>`,
  async onOk(){const v=$("rd").value,t=$("rt").value||"00:00";if(!v){toast("Pick a date.");return false}
   const at=new Date(v+"T"+t).getTime();if(!(at>Date.now())){toast("Choose a time in the future.");return false}
   await api(`/linkedin/api/posts/${p.id}/reschedule`,{method:"POST",body:{whenAt:at}});toast("Rescheduled for "+new Date(at).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}));wk=mon(new Date(at));sel=v;await reload()}})}
function del(ids,label){
 openModal({title:ids.length>1?`Delete ${ids.length} posts?`:label,ok:"Delete",danger:true,body:`<p>${ids.length>1?"These posts":"This post"} will be removed from your queue${ids.length>1?"":" and can’t be recovered"}. Anything already published on LinkedIn stays there.</p>`,
  async onOk(){let fail=0;for(const id of ids){try{await api("/linkedin/api/posts/"+id,{method:"DELETE"});picked.delete(id)}catch{fail++}}
   toast(fail?`${ids.length-fail} deleted, ${fail} couldn’t be deleted`:ids.length>1?"Posts deleted":"Post deleted");await reload()}})}
async function act(a,id){
 const p=posts.find(x=>x.id===id);if(!p)return;
 try{
  if(a==="edit")location.href="/linkedin/?edit="+id;
  else if(a==="view")window.open("https://www.linkedin.com/feed/update/"+encodeURIComponent(p.urn)+"/","_blank","noopener");
  else if(a==="dup"){await api(`/linkedin/api/posts/${id}/duplicate`,{method:"POST"});toast("Duplicated as a draft");await reload()}
  else if(a==="now"){await api(`/linkedin/api/posts/${id}/retry`,{method:"POST"});toast("Sending to LinkedIn…");await reload()}
  else if(a==="resch")resched(p);
  else if(a==="del")del([id],p.status==="published"?"Remove this post from your queue?":p.status==="draft"?"Delete this draft?":"Delete this post?")}
 catch(e){toast(e.message)}}

/* ---------- events ---------- */
$("list").addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;
 if(b.dataset.a==="create"){location.href="/linkedin/";return}
 const id=+b.closest(".pc").dataset.id;
 if(b.dataset.a==="menu"){const p=posts.find(x=>x.id===id);if(p)openMenu(b,postMenu(p),k=>act(k,id));return}
 act(b.dataset.a,id)});
$("list").addEventListener("change",e=>{const c=e.target.closest("[data-ck]");if(!c)return;const id=+c.closest(".pc").dataset.id;c.checked?picked.add(id):picked.delete(id);c.closest(".pc").classList.toggle("sel",c.checked);renderBulk()});
$("bulk").onclick=e=>{const b=e.target.closest("[data-b]");if(!b)return;
 if(b.dataset.b==="clear")picked.clear();
 if(b.dataset.b==="all")visible().forEach(p=>picked.add(p.id));
 if(b.dataset.b==="del"){const ids=[...picked].filter(id=>posts.find(p=>p.id===id&&p.status!=="publishing"));if(!ids.length){toast("Nothing to delete.");return}del(ids,"");return}
 renderBulk();renderList()};
document.addEventListener("click",e=>{const f=e.target.closest("[data-f]");if(f&&!f.closest("#menu")){setFilter(f.dataset.f===filter&&f.closest("#stats")?"all":f.dataset.f)}
 if(e.target.closest("[data-clearday]")){dayF=null;renderTop();renderList()}});
$("days").onclick=e=>{const b=e.target.closest(".day");if(!b)return;const k=b.dataset.d;dayF=dayF===k?null:k;sel=k;renderWeek();renderTop();renderList()};
$("pw").onclick=()=>{wk=add(wk,-7);renderWeek();renderChart()};$("nw").onclick=()=>{wk=add(wk,7);renderWeek();renderChart()};$("wkb").onclick=()=>{wk=thisMon;sel=iso(add(thisMon,4));dayF=null;renderWeek();renderChart();renderTop();renderList()};
$("q").oninput=e=>{q=e.target.value;renderList()};
$("create").onclick=()=>location.href="/linkedin/";
document.querySelectorAll(".tab[data-go]").forEach(t=>t.onclick=()=>location.href=t.dataset.go);
$("out").onclick=async()=>{const r=await api("/linkedin/api/logout",{method:"POST"}).catch(()=>({}));location.href=r.owner?"/":"/linkedin/classic.html"};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)reloadSoon(0)});
addEventListener("online",()=>reloadSoon(0));addEventListener("pageshow",e=>{if(e.persisted)reloadSoon(0)});
// Safety net only: slow poll when the live connection is down (live updates arrive instantly otherwise).
setInterval(()=>{if(!document.hidden&&!live)reloadSoon(0)},20000);

renderAll();
api("/linkedin/api/me").then(me=>{$("me").textContent=me.name+(me.role==="admin"?" (admin)":"")}).catch(()=>{});
reload();
</script>
<script src="/linkedin/shell.js"></script>
</body>
</html>
