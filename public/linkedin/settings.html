<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings · Autopilot for LinkedIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1123;--card:#10182e;--line:#1c2542;--line2:#283254;--text:#eef0ff;--muted:#8f9bbd;--dim:#7b88c9;--v:#5f38fd;--vtext:#8f6bff;--green:#2fd6a4;--amber:#f5b94a;--red:#ff6b81;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:400 14px/1.45 Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.fl{flex:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--vtext);outline-offset:2px}
.row{display:flex;align-items:center}
.av{border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;background:#c9ced8}
h2,h3,p{margin:0}
/* header + week strip + tabs come from /shell.css; these are the pieces that only exist on this page */
.ph{justify-content:space-between;gap:16px;margin-top:24px;flex-wrap:wrap;align-items:flex-start}
.ph h2{font-size:24.6px;font-weight:700;letter-spacing:-.005em;line-height:1.2}
.ph p{margin-top:4px;color:#9ba7c9;font-size:14px}
.btn{height:35px;border-radius:8px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600;border:1px solid var(--line2);background:rgba(11,17,35,.55);white-space:nowrap}
.btn:hover:not(:disabled){border-color:#3b4780}
.btn svg.i{width:16px;height:16px}
.btn.p{border:0;background:linear-gradient(180deg,#6a43ff,#5a33f5);color:#fff;box-shadow:0 4px 14px rgba(95,56,253,.28)}
.btn.p:hover:not(:disabled){background:linear-gradient(180deg,#7450ff,#6139fa)}
.btn.big{height:45px;border-radius:10px;padding:0 20px;font-size:14px;gap:12px}
.btn.big svg.i{width:19px;height:19px}
.btn.d{border-color:rgba(255,107,129,.4);color:var(--red)}
.ddw{position:relative}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:16px}
.stat{display:flex;align-items:center;gap:20px;padding:12px 20px;height:81px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#111a31,#0f172c)}
.tile{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;flex:none}
.tile svg.i{width:26px;height:26px;stroke-width:1.6}
.t-li{background:#0d2e5d}
.t-co{background:#202743;color:#8f9bd0}
.t-tm{background:#1f1e4f;color:#8b6cff}
.stat b{font-size:23px;font-weight:700;line-height:1;min-width:14px}
.stat span{font-size:13px;line-height:1.35;color:var(--muted);margin-left:-2px}
.stat span em{display:block;font-style:normal;color:#d8def5}
/* section pills */
.pills{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.pt{height:29px;padding:0 24px;border-radius:999px;border:1px solid var(--line2);background:rgba(17,25,48,.7);font-size:12px;font-weight:500;color:#c6cdea}
.pt:hover{border-color:#3b4780}
.pt[aria-pressed=true]{background:var(--v);border-color:var(--v);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(95,56,253,.35)}
/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;margin-top:12px;align-items:stretch}
.stack{display:grid;gap:16px;align-content:start}
.panel{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#111a31,#0f172c);padding:16px 16px 16px}
.pheader{display:flex;align-items:flex-start;gap:12px;padding:0 8px;margin-bottom:8px}
.pheader>svg.i{width:22px;height:22px;color:#7c5cff;margin-top:2px;stroke-width:1.7}
.pheader h3{font-size:14.5px;font-weight:700;line-height:1.3}
.pheader p{margin-top:2px;font-size:12px;color:#9ba7c9}
.pheader .grow{flex:1;min-width:0}
/* account rows */
.prow{display:grid;grid-template-columns:minmax(190px,1.15fr) minmax(210px,1fr) auto;align-items:center;gap:16px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card2,#0d1427)}
.prow+.prow{margin-top:12px}
.who{display:flex;align-items:center;gap:16px;min-width:0}
.who .av{width:53px;height:53px;font-size:18px}
.who .sq{width:53px;height:53px;border-radius:50%;background:#1d204a;color:#8f9bd0;display:grid;place-items:center;flex:none}
.who .sq svg.i{width:24px;height:24px}
.nm{display:flex;align-items:center;gap:8px;font-size:13.4px;font-weight:600;min-width:0}
.nm span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;margin-top:3px;font-size:12px;color:#9ba7c9}
.st{display:grid;gap:8px;justify-items:start}
.chip{display:inline-flex;align-items:center;gap:8px;height:22px;padding:0 12px;border-radius:7px;font-size:12px;font-weight:500;background:rgba(47,214,164,.13);color:var(--green)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.warn{background:rgba(245,185,74,.14);color:var(--amber)}
.chip.bad{background:rgba(255,107,129,.14);color:var(--red)}
.note{display:flex;align-items:center;gap:8px;font-size:12px;color:#9ba7c9}
.note svg.i{width:14px;height:14px}
.acts{display:flex;align-items:center;gap:12px;justify-self:end}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:none;display:grid;place-items:center;color:#c6cdea}
.ib:hover{background:#18213f;border-color:var(--line2)}
.ib svg{width:20px;height:20px;fill:currentColor}
/* empty states */
.empty{display:flex;align-items:center;justify-content:center;gap:40px;padding:36px 20px;border:1px solid var(--line);border-radius:12px;background:#0d1427;min-height:157px;flex-wrap:wrap}
.empty .big{width:68px;height:68px;border-radius:50%;background:#1d204a;color:#9aa6d6;display:grid;place-items:center;flex:none}
.empty .big svg.i{width:30px;height:30px;stroke-width:1.5}
.empty h4{margin:0;font-size:13.5px;font-weight:700}
.empty p{margin-top:4px;max-width:430px;font-size:12px;color:#9ba7c9;line-height:1.5}
.empty .bt{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.empty .btn{height:37px;border-radius:8px;padding:0 20px}
/* connection health */
.health{display:flex;flex-direction:column}
.hh{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.hic{width:38px;height:38px;border-radius:50%;background:#12304f;color:#4aa8ff;display:grid;place-items:center;flex:none}
.hic svg.i{width:20px;height:20px}
.hh h3{font-size:14.5px;font-weight:700}
.hh p{margin-top:2px;font-size:12px;color:#9ba7c9}
.hh .grow{flex:1;min-width:0}
.hh .btn{height:34px;border-radius:8px;padding:0 16px;font-size:12px;gap:8px}
.hh .btn svg.i{width:15px;height:15px}
@media (min-width:1100px){.hh p{white-space:nowrap}}
.spin svg.i{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin svg.i{animation:none}}
.hbox{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:10px;border:1px solid rgba(47,214,164,.28);background:linear-gradient(180deg,#0a2a2f,#0a272d)}
.hbox .ci{width:37px;height:37px;border-radius:50%;display:grid;place-items:center;background:#14b985;color:#fff;flex:none}
.hbox .ci svg.i{width:20px;height:20px;stroke-width:2.4}
.hbox strong{display:block;font-size:12.5px;font-weight:700;color:var(--green)}
.hbox small{display:block;margin-top:3px;font-size:12px;color:#aab5d6}
.hbox.warn{border-color:rgba(245,185,74,.35);background:#2a2412}.hbox.warn .ci{background:#d99a2b}.hbox.warn strong{color:var(--amber)}
.hbox.bad{border-color:rgba(255,107,129,.38);background:#2c1520}.hbox.bad .ci{background:#e0455b}.hbox.bad strong{color:var(--red)}
.hbox.off{border-color:var(--line2);background:#111a31}.hbox.off .ci{background:#2a3358;color:#aeb8d9}.hbox.off strong{color:#d8def5}
.hl{list-style:none;margin:12px 4px 16px;padding:0;display:grid;gap:12px}
.hl li{display:flex;align-items:center;gap:12px;font-size:12px;line-height:1.3;color:#d2d8f2}
.hl li .d{width:13px;height:13px;border-radius:50%;display:grid;place-items:center;background:#14b985;color:#06231d;flex:none}
.hl li .d svg.i{width:9px;height:9px;stroke-width:3.4}
.hl li.warn .d{background:#d99a2b;color:#2a1c00}.hl li.bad .d{background:#e0455b;color:#fff}.hl li.off .d{background:#2a3358;color:#aeb8d9}
.hl li b{margin-left:auto;font-size:12px;font-weight:500;color:var(--green)}
.hl li.warn b{color:var(--amber)}.hl li.bad b{color:var(--red)}.hl li.off b{color:var(--muted)}
.help{margin-top:auto;display:flex;gap:16px;padding:16px 16px;border-radius:10px;border:1px solid var(--line);background:#0d1427}
.help .bi{width:38px;height:38px;border-radius:50%;background:#2e2e68;color:#f1eeff;display:grid;place-items:center;flex:none}
.help .bi svg.i{width:19px;height:19px}
.help h4{margin:0;font-size:12.5px;font-weight:700}
.help p{margin-top:4px;font-size:12px;color:#9ba7c9;line-height:1.5}
.help a{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--vtext);text-decoration:none;background:none;border:0;padding:0}
.help a:hover{text-decoration:underline}
/* team */
.team{margin-top:16px;padding:12px 0 0;overflow:hidden}
.team .thead{display:flex;align-items:center;gap:16px;padding:0 20px 12px 24px;flex-wrap:wrap}
.team .thead .pheader{margin:0;padding:0;flex:1;min-width:260px}
.inv{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fld{display:flex;align-items:center;gap:12px;height:37px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:#0c1329;color:#8f9bbd}
.fld:focus-within{border-color:#6b4ff0}
.fld input,.fld select{background:none;border:0;outline:0;color:var(--text);font-size:12px;height:100%;min-width:0}
.fld input{width:100%}
.fld.em{width:313px}
.fld input::placeholder{color:#7783ab}
.fld.sel{width:147px;position:relative}
.fld.sel select{appearance:none;-webkit-appearance:none;width:100%;padding-right:24px;cursor:pointer}
.fld.sel select option{background:#10182e}
.fld.sel svg.i{position:absolute;right:11px;width:15px;height:15px;pointer-events:none}
.fld svg.i{width:18px;height:18px}
.inv .btn{height:37px;border-radius:8px;padding:0 0;width:147px;font-size:12px}
.tbl{width:100%}
.tr{display:grid;grid-template-columns:minmax(210px,2.35fr) minmax(190px,2fr) minmax(90px,1.1fr) minmax(110px,1.3fr) minmax(110px,1.4fr) 70px;align-items:center;gap:8px;padding:0 24px}
.tr.h{height:33px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0d1427;font-size:12px;color:var(--muted)}
.tr.b{height:54px;font-size:12px;color:#d8def5}
.tr.b+.tr.b{border-top:1px solid var(--line)}
.tr .r{text-align:right;justify-self:end}
.tr .who .av{width:38px;height:38px;font-size:14px}
.tr .who{gap:12px}
.tr .nm{font-size:12.5px}
.tr .who small{margin-top:1px;font-size:12px}
.you{height:19px;padding:0 8px;border-radius:7px;background:#4a2fc8;color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center}
.tr .cut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .chip{height:24px;padding:0 12px;font-size:12px}
/* menus + dialogs + toast */
.menu{position:fixed;z-index:30;min-width:210px;padding:8px;border:1px solid var(--line2);border-radius:11px;background:#131b36;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.menu button{width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px;border:0;border-radius:8px;background:none;text-align:left;font-size:13.5px;font-weight:500}
.menu button:hover:not(:disabled){background:#1b2548}
.menu button small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.menu button svg.i{width:18px;height:18px;color:#aeb8d9}
.menu button.dn{color:var(--red)}.menu button.dn svg.i{color:var(--red)}
dialog{width:min(480px,calc(100vw - 28px));max-height:calc(100vh - 40px);padding:0;border:1px solid var(--line2);border-radius:16px;background:#0f172c;color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,8,22,.72)}
.dh{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 0}
.dh h3{font-size:17px;font-weight:700}
.dh p{margin-top:3px;font-size:13px;color:var(--muted)}
.dh .ib{margin-left:auto;margin-top:-4px}
.dh .ib svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.db{padding:16px 24px 4px;font-size:13.5px;color:#d2d8f2}
.db ul{margin:0;padding-left:20px;display:grid;gap:8px;line-height:1.5}
.db code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:#18213f;padding:1px 8px;border-radius:5px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:12px 12px;padding:8px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.lbl{display:block;margin:12px 0 8px;font-size:13px;font-weight:600;color:#d2d8f2}
.fld.w{width:100%}.fld.w input{width:100%}
.fld.w.sel{width:100%}
.df{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px 20px;flex-wrap:wrap}
.pw{display:flex;gap:8px}.pw .fld{flex:1}.pw input{font-family:ui-monospace,Menlo,Consolas,monospace}
.hint{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1a2150;border:1px solid #4d56a8;padding:12px 20px;border-radius:11px;opacity:0;pointer-events:none;transition:.2s;z-index:50;font-weight:500;font-size:13.5px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sk{color:transparent!important;background:linear-gradient(90deg,#141d38,#1a2447,#141d38);background-size:200% 100%;border-radius:6px;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:1060px){.cols{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.health{order:2}}
@media (max-width:760px){.prow{grid-template-columns:1fr;gap:12px}.acts{justify-self:start}.empty{gap:20px}.tbl{overflow-x:auto}.tr{min-width:760px}.fld input{width:100%}.inv{width:100%}.inv .fld:first-child{flex:1 1 100%}.btn.big{height:42px}}

/* settings page */
.f{margin-top:16px}.g2 .f{margin-top:0}.g2{margin-top:8px}
.f>.lb{display:block;font-size:12px;font-weight:600;color:#c6cdea;margin:0 0 8px}
.f .fld{height:42px;color:var(--text)}.f .fld input{font-size:13px}
.f .fld.ro{background:#0a1022}.f .fld.ro input{color:#c6cdea}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.nt{margin-top:8px;font-size:12px;color:#9ba7c9;line-height:1.5}.nt code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#cfc6ff;background:#171f3d;border-radius:5px;padding:1px 4px}
.nt a,.pheader a{color:var(--vtext)}
.acts2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.okc{color:var(--green);font-weight:600}.warnc{color:var(--amber);font-weight:600}.badc{color:var(--red);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line2);color:#c6cdea;white-space:nowrap}
.chip.ok{border-color:rgba(47,214,164,.4);color:var(--green);background:rgba(47,214,164,.08)}
.chip.no{border-color:rgba(245,185,74,.4);color:var(--amber);background:rgba(245,185,74,.08)}
.rem{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.rem li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#0c1329;font-size:12px;color:#c6cdea}
.row2{display:flex;gap:12px;align-items:stretch}.row2 .fld{flex:1}
@media (max-width:760px){.g2{grid-template-columns:1fr}.acts2 .btn{flex:1}}
.sbar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:24px;padding:16px 24px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));border:1px solid var(--line2);border-radius:16px;background:rgba(10,14,34,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sbar[hidden]{display:none}.sst{font-size:14px;font-weight:600;color:var(--muted)}.sst.warn{color:var(--amber)}.sst.ok{color:var(--green)}.sst.bad{color:var(--red)}
.inl{font-size:12px;font-weight:600;color:var(--muted)}.inl.ok{color:var(--green)}.inl.bad{color:var(--red)}
.fld input[aria-invalid=true]{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
@media (max-width:640px){.sbar{flex-direction:column;align-items:stretch;gap:8px}}
</style>
<link rel="stylesheet" href="/linkedin/shell.css">
</head>

<defs>
<symbol id="spark" viewBox="0 0 24 24"><path d="M10 3l1.800 5.200L17 10l-5.200 1.800L10 17l-1.800-5.200L3 10l5.200-1.800zM18 14l.9 2.600 2.600.9-2.600.9L18 21l-.9-2.600-2.600-.9 2.600-.9z"/></symbol>
<symbol id="send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
<symbol id="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>

<symbol id="pen" viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14 7.5l3 3M12 20h8"/></symbol>

<symbol id="link" viewBox="0 0 24 24"><path d="M10 14a4.500 4.500 0 0 0 6.400 0l3-3a4.500 4.500 0 0 0-6.400-6.400l-1.500 1.500"/><path d="M14 10a4.500 4.500 0 0 0-6.400 0l-3 3a4.500 4.500 0 0 0 6.400 6.400l1.500-1.500"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="li" viewBox="0 0 24 24"><rect width="24" height="24" rx="4.500" fill="#0a66c2"/><path fill="#fff" d="M6.100 9.600h2.700V18H6.100zM7.450 5.700a1.560 1.560 0 1 1 0 3.120 1.560 1.560 0 0 1 0-3.120zM10.500 9.600h2.600v1.150h.04c.36-.7 1.250-1.400 2.570-1.400 2.750 0 3.250 1.800 3.250 4.150V18h-2.700v-3.900c0-.93-.02-2.130-1.300-2.130-1.300 0-1.500 1-1.500 2.060V18h-2.700z"/></symbol>
<symbol id="inm" viewBox="0 0 24 24"><path fill="currentColor" d="M3.500 9.600h3.200V20H3.500zM5.100 4.200a1.900 1.900 0 1 1 0 3.800 1.900 1.900 0 0 1 0-3.800zM9.200 9.600h3.100v1.400h.05c.43-.82 1.500-1.700 3.100-1.700 3.300 0 3.900 2.200 3.900 5V20h-3.200v-5.200c0-1.200 0-2.800-1.700-2.800s-2 1.300-2 2.700V20H9.200z"/></symbol>
<symbol id="face" viewBox="0 0 64 64"><rect width="64" height="64" fill="#cfd4de"/><path d="M6 64c2-14 12-18 26-18s24 4 26 18z" fill="#1d2433"/><path d="M26 44h12v8c-2 3-10 3-12 0z" fill="#b9805a"/><ellipse cx="32" cy="28" rx="11" ry="14" fill="#c8895f"/><path d="M20 26c0-10 7-14 13-14s12 4 12 12c-2-5-6-7-11-7s-10 2-14 9z" fill="#1d1a1a"/></symbol>
</defs>
</svg>

<div class="wrap">
  <header class="row">
    <div class="row brand">
      <div class="logo"><svg class="i"><use href="#send"/></svg></div>
      <div><h1>Autopilot for LinkedIn</h1><p>Configure LinkedIn, reminders and API version</p></div>
    </div>
    <div class="row right">
      <div class="row user"><svg class="av" viewBox="0 0 64 64"><use href="#face"/></svg><span id="me">Loading…</span><svg class="i"><use href="#chev"/></svg></div>
      <button class="signout" id="out">Sign out</button>
    </div>
  </header>

  <section class="row week" hidden aria-label="Week">
    <div class="days" id="days"></div>
    <div class="row nav">
      <button id="pw" aria-label="Previous week"><svg class="i"><use href="#left"/></svg></button>
      <button class="mid" id="wkb"><svg class="i"><use href="#cal"/></svg><span id="wk">This week</span></button>
      <button id="nw" aria-label="Next week"><svg class="i"><use href="#right"/></svg></button>
    </div>
  </section>

  <nav class="row tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="false" data-go="/linkedin/"><svg class="i"><use href="#pen"/></svg>Schedule</button>
    <button class="tab" role="tab" aria-selected="false" data-go="/linkedin/queue.html"><svg class="i"><use href="#cal"/></svg>Queue</button>
    <button class="tab" role="tab" aria-selected="false" data-go="/linkedin/analytics.html"><svg class="i"><use href="#bars"/></svg>Analytics</button>
    <button class="tab" role="tab" aria-selected="false" data-go="/linkedin/accounts.html"><svg class="i"><use href="#users"/></svg>Accounts</button>
    <button class="tab" role="tab" aria-selected="false" data-go="/linkedin/auto.html"><svg class="i"><use href="#spark"/></svg>Auto content</button>
    <button class="tab" role="tab" aria-selected="true"><svg class="i"><use href="#gear"/></svg>Settings</button>
    <a class="tablink" href="/#calendar/linkedin" title="LinkedIn posts on the content calendar"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendar</a>
    <a class="plat" href="/" title="All apps"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>All apps</a>
  </nav>

  <main>
    <section class="row ph">
      <div><h2>Settings</h2><p>Connect your LinkedIn app, get connection reminders and keep the API version current.</p></div>
    </section>
    <div class="pills" role="group" aria-label="Jump to section">
      <button class="pt" data-s="sl" aria-pressed="true">LinkedIn app</button>
      <button class="pt" data-s="sr" aria-pressed="false">Reminders</button>
      <button class="pt" data-s="sv" aria-pressed="false">API version</button>
    </div>
    <div class="cols" id="cols"><div class="stack"><div class="panel"><div class="skl-row"><span class="skl" style="height:24px;width:40%"></span><span class="skl" style="height:42px"></span><span class="skl" style="height:42px"></span><span class="skl" style="height:42px"></span></div></div></div><div class="stack"><div class="panel"><div class="skl-row"><span class="skl" style="height:24px;width:50%"></span><span class="skl" style="height:42px"></span><span class="skl" style="height:42px"></span></div></div></div></div>
    <div class="sbar" id="sbar" hidden><span class="sst" id="sst" role="status">All changes saved</span><button class="btn p big" id="sall" disabled>Save changes</button></div>
  </main>
  <div class="toast" id="toast" role="status"></div>
</div>
<script>
const $=id=>document.getElementById(id),P=n=>String(n).padStart(2,"0"),DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],DAY=864e5;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+P(d.getMonth()+1)+"-"+P(d.getDate());
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>{const x=new Date(d);x.setHours(0,0,0,0);return add(x,-((x.getDay()+6)%7))};
const today=new Date(),thisMon=mon(today),md={month:"short",day:"numeric"};
const fdate=t=>t?new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—";
const ic=(n,c="")=>`<svg class="i ${c}"><use href="#${n}"/></svg>`;
let me=null,accounts=[],users=[],status=null,posts=[],wk=thisMon,sel=iso(add(thisMon,4)),checked=new Date(),tt;
const isAdmin=()=>me&&me.role==="admin";
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3400)}
async function api(p,o={}){const r=await fetch(p,{method:o.method||"GET",headers:{"Content-Type":"application/json"},body:o.body?JSON.stringify(o.body):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)location.href="/linkedin/classic.html";throw new Error(j.error||"Something went wrong")}return j}
function avatar(name,size){
 const parts=String(name||"?").trim().split(/\s+/),ini=((parts[0]||"?")[0]+(parts.length>1?parts[parts.length-1][0]:"")).toUpperCase();
 let h=0;for(const c of String(name))h=(h*31+c.charCodeAt(0))%360;
 return `<span class="av" style="width:${size}px;height:${size}px;background:linear-gradient(145deg,hsl(${h} 55% 52%),hsl(${(h+40)%360} 55% 36%))" aria-hidden="true">${esc(ini)}</span>`}
const face=size=>`<svg class="av" viewBox="0 0 64 64" style="width:${size}px;height:${size}px" aria-hidden="true"><use href="#face"/></svg>`;

/* ---- week strip ---- */
const pkey=p=>p.status==="published"?(p.published_at||p.when_at):p.when_at;
function renderWeek(){
 const real=posts.filter(p=>p.status!=="draft");
 $("days").innerHTML=[0,1,2,3,4,5,6].map(i=>{const d=add(wk,i),k=iso(d),n=real.filter(p=>iso(new Date(pkey(p)))===k).length;
  return `<button class="day${n?" has":""}" data-d="${k}" aria-pressed="${k===sel}"><span class="dn">${DN[d.getDay()]}</span><span class="num">${d.toLocaleDateString("en-US",md)}</span><span class="ct">${n} ${n==1?"post":"posts"}</span></button>`}).join("");
 const df=Math.round((wk-thisMon)/6048e5);
 $("wk").textContent=df==0?"This week":df==1?"Next week":df==-1?"Last week":wk.toLocaleDateString("en-US",md)+" – "+add(wk,6).toLocaleDateString("en-US",md)}
$("days").onclick=e=>{const b=e.target.closest(".day");if(b)location.href="/linkedin/?date="+b.dataset.d};
$("pw").onclick=()=>{wk=add(wk,-7);renderWeek()};$("nw").onclick=()=>{wk=add(wk,7);renderWeek()};$("wkb").onclick=()=>{wk=thisMon;renderWeek()};


const fmt=t=>t?new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—";
document.querySelectorAll(".tab[data-go]").forEach(t=>t.onclick=()=>location.href=t.dataset.go);
document.querySelectorAll(".pt").forEach(b=>b.onclick=()=>{document.querySelectorAll(".pt").forEach(x=>x.setAttribute("aria-pressed",x===b));
 $(b.dataset.s).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"})});
$("out").onclick=async()=>{const r=await api("/linkedin/api/logout",{method:"POST"}).catch(()=>({}));location.href=r.owner?"/":"/linkedin/classic.html"};

async function renderSettings(){
 const s=await api("/linkedin/api/settings"),v=s.version,conns=accounts.filter(a=>a.kind==="member"&&a.expires_at);
 const src={settings:"Saved in this app.",env:"Currently read from LINKEDIN_VERSION on the server. Saving here overrides it.",default:"Currently the built-in default. Saving here overrides it."}[s.versionSource]||"";
 const vm=v.age==null?"":v.level==="ok"?`<span class="okc">${v.age} month${v.age==1?"":"s"} old. Fine for now.</span>`:v.level==="soon"?`<span class="warnc">${v.age} months old. Update it soon.</span>`:`<span class="badc">${v.age} months old. LinkedIn has probably retired it.</span>`;
 const ready=s.linkedin.clientId&&s.linkedin.secretSet;
 $("cols").innerHTML=`
 <div class="stack">
  <section class="panel" id="sl">
   <div class="pheader">${ic("inl")}<div class="grow"><h3>LinkedIn app</h3><p>From your app at <a href="https://developers.linkedin.com" target="_blank" rel="noopener">developers.linkedin.com</a>. The secret is stored encrypted on your server.</p></div>
    <span class="chip ${ready?"ok":"no"}">${ready?"Ready to connect":"Needs Client ID + Secret"}</span></div>
   <div class="g2" style="padding:0 8px">
    <div class="f"><label class="lb" for="lid">Client ID</label><div class="fld"><input id="lid" autocomplete="off" value="${esc(s.linkedin.clientId)}"></div></div>
    <div class="f"><label class="lb" for="lse">Client Secret</label><div class="fld"><input id="lse" type="password" autocomplete="new-password" placeholder="${s.linkedin.secretSet?"Saved. Paste a new one to replace it.":"Paste the secret"}"></div></div>
    <div class="f"><label class="lb" for="lsc">Scopes</label><div class="fld"><input id="lsc" autocomplete="off" value="${esc(s.linkedin.scopes)}"></div></div>
    <div class="f"><label class="lb" for="lau">Public address of this site</label><div class="fld"><input id="lau" autocomplete="off" value="${esc(s.appUrl)}"></div></div>
   </div>
   <div style="padding:0 8px">
    <p class="nt">Personal profiles use <code>openid profile w_member_social</code>. For company pages (needs Community Management API approval) add <code>w_organization_social r_organization_social</code>.</p>
    <div class="f"><label class="lb" for="lru">Add this Redirect URL in your LinkedIn app under Auth</label><div class="row2"><div class="fld ro"><input id="lru" readonly value="${esc(s.redirectUrl)}"></div><button class="btn" id="lcp">${ic("copy")}<span>Copy</span></button></div></div>
    <p class="nt" style="margin-top:16px">${ready?'<span class="okc">Ready to connect accounts.</span>':"Client ID and Secret are both needed."}</p>
   </div>
  </section>
 </div>
 <div class="stack">
  <section class="panel" id="sr">
   <div class="pheader">${ic("pulse")}<div class="grow"><h3>Connection reminders</h3><p>LinkedIn logins last about 60 days and can't be refreshed automatically. The team sees a banner before a connection ends.</p></div></div>
   <div style="padding:0 8px">
    <div class="f"><label class="lb" for="sd">Days before expiry</label><div class="fld"><input id="sd" type="number" min="1" max="30" value="${s.reminderDays}"></div></div>
    <div class="f"><label class="lb" for="sw">Also post to a Slack or Discord channel (optional)</label><div class="fld"><input id="sw" type="url" autocomplete="off" placeholder="${s.webhook.set?"Saved for "+esc(s.webhook.host)+". Paste a new address to replace it.":"https://hooks.slack.com/services/..."}"></div></div>
    <p class="nt">The channel gets one message when a connection enters the window and one if it expires.</p>
    <div class="acts2"><button class="btn" id="stw" ${s.webhook.set?"":"disabled"}>Send test message</button>${s.webhook.set?'<button class="btn d" id="srw">Remove webhook</button>':""}<span class="inl" id="wmsg" role="status"></span></div>
    ${conns.length?`<ul class="rem">${conns.map(a=>`<li><span>${esc(a.name)}</span><span>${a.expired?'<span class="badc">expired</span>':`ends ${fmt(a.expires_at)} (${Math.ceil((a.expires_at-Date.now())/DAY)} days)`}</span></li>`).join("")}</ul>`:""}
   </div>
  </section>
  <section class="panel" id="sv">
   <div class="pheader">${ic("refresh")}<div class="grow"><h3>LinkedIn API version</h3><p>Sent with every request. LinkedIn retires old versions after about a year. See <a href="https://learn.microsoft.com/en-us/linkedin/marketing/versioning" target="_blank" rel="noopener">LinkedIn's versioning guide</a>.</p></div></div>
   <div style="padding:0 8px">
    <div class="f"><label class="lb" for="svv">Version (YYYYMM)</label><div class="fld"><input id="svv" inputmode="numeric" maxlength="6" value="${esc(s.linkedinVersion)}"></div></div>
    <p class="nt">${esc(src)} ${vm}</p>
    <div class="acts2"><button class="btn" id="vsg">Use ${esc(s.suggestedVersion)}</button></div>
    <p class="nt" style="margin-top:12px">After changing it, schedule a test post a few minutes out to confirm LinkedIn accepts it.</p>
   </div>
  </section>
 </div>`;
 const F=["lid","lse","lsc","lau","sd","sw","svv"],snap=()=>F.map(i=>$(i).value).join("\u0001"),base=snap();
 const bar=$("sbar"),st=$("sst"),btn=$("sall");bar.hidden=false;
 const setSt=(t,k)=>{st.textContent=t;st.className="sst"+(k?" "+k:"")};
 const dirty=()=>snap()!==base;
 const refresh=()=>{const d=dirty();btn.disabled=!d;if(d)setSt("Unsaved changes","warn");else if(!st.classList.contains("ok"))setSt("All changes saved")};
 F.forEach(i=>{$(i).addEventListener("input",()=>{st.classList.remove("ok","bad");F.forEach(x=>$(x).removeAttribute("aria-invalid"));refresh()})});
 const bad=(msg)=>{setSt(msg,"bad");const m=/version/i.test(msg)?"svv":/day|remind/i.test(msg)?"sd":/webhook|slack|discord/i.test(msg)?"sw":/address|site|url/i.test(msg)?"lau":/client id/i.test(msg)?"lid":/secret/i.test(msg)?"lse":/scope/i.test(msg)?"lsc":null;
  if(m){$(m).setAttribute("aria-invalid","true");$(m).focus()}};
 btn.onclick=async()=>{
  const b={linkedinClientId:$("lid").value.trim(),linkedinScopes:$("lsc").value.trim(),appUrl:$("lau").value.trim(),reminderDays:+$("sd").value,linkedinVersion:$("svv").value.trim()},k=$("lse").value.trim(),w=$("sw").value.trim();
  if(k)b.linkedinClientSecret=k;if(w)b.webhookUrl=w;
  btn.disabled=true;setSt("Saving…");
  try{await api("/linkedin/api/settings",{method:"PUT",body:b});const t=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});await renderSettings();$("sst").className="sst ok";$("sst").textContent="Saved at "+t}
  catch(e){btn.disabled=false;bad(e.message)}};
 const wm=(t,k)=>{const e=$("wmsg");if(e){e.textContent=t;e.className="inl "+(k||"")}};
 $("lcp").onclick=()=>{$("lru").select();const c=$("lcp");navigator.clipboard?.writeText(s.redirectUrl).then(()=>{c.lastChild.textContent="Copied";setTimeout(()=>c.lastChild.textContent="Copy",1600)},()=>{c.lastChild.textContent="Press Ctrl+C"})};
 $("stw").onclick=async()=>{wm("Sending…");try{await api("/linkedin/api/settings/test-webhook",{method:"POST"});wm("Test message sent","ok")}catch(e){wm(e.message,"bad")}};
 const rw=$("srw");if(rw)rw.onclick=async()=>{try{await api("/linkedin/api/settings",{method:"PUT",body:{webhookUrl:""}});await renderSettings();$("sst").className="sst ok";$("sst").textContent="Webhook removed"}catch(e){wm(e.message,"bad")}};
 $("vsg").onclick=()=>{$("svv").value=s.suggestedVersion;$("svv").dispatchEvent(new Event("input"))}}

(async()=>{
 renderWeek();
 try{
  me=await api("/linkedin/api/me");$("me").textContent=me.name+(me.role==="admin"?" (admin)":"");
  if(me.role!=="admin"){$("cols").innerHTML='<div class="panel"><p class="nt">Settings are for admins only. Ask an admin to change them.</p></div>';return}
  const[a,p]=await Promise.all([api("/linkedin/api/accounts"),api("/linkedin/api/posts").catch(()=>[])]);
  accounts=a;posts=p;renderWeek();await renderSettings()
 }catch(e){$("cols").innerHTML=`<div class="panel"><p class="inl bad" role="alert">${esc(e.message||"Settings could not be loaded")}. <a href="/linkedin/settings.html">Try again</a></p></div>`}
})();
</script>
<script src="/linkedin/shell.js"></script>
</body>
</html>
