<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#090a1f">
  <title>DM Autopilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/builder.css">
  <link rel="stylesheet" href="/pages.css">
  <link rel="stylesheet" href="/calendar.css">
</head>
<body>
  <!-- shared gradients referenced by inline icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g-ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".62" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient>
      <linearGradient id="g-bolt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    </defs>
  </svg>

  <div id="login" class="login" hidden>
    <form id="login-form" class="card login-card">
      <div class="brand"><span data-logo></span>DM Autopilot</div>
      <p class="muted">Sign in to manage your Instagram automation.</p>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <p class="error" id="login-error" hidden></p>
      <button class="btn primary" type="submit" style="justify-content:center">Sign in</button>
    </form>
  </div>

  <div id="app" class="shell" hidden>
    <aside class="side">
      <a class="brand" href="#" id="brand"><span data-logo></span><span id="brand-name">DM Automation</span></a>
      <nav id="nav" aria-label="Main">
        <a href="/" class="nav-home" title="All apps"><i data-ic="grid"></i><span>All apps</span></a>
        <a href="#overview" data-view="overview"><i data-ic="home"></i><span>Overview</span></a>
        <a href="#rules" data-view="rules" data-more><i data-ic="zap"></i><span>Automations</span></a>
        <a href="#flows" data-view="flows"><i data-ic="flow"></i><span>Flows</span></a>
        <a href="#inbox" data-view="inbox"><i data-ic="chat"></i><span>Inbox</span><em class="badge" id="badge" hidden></em></a>
        <a href="#posts" data-view="posts"><i data-ic="calendar"></i><span>Calendar</span></a>
        <a href="#insights" data-view="insights"><i data-ic="chart"></i><span>Insights</span></a>
        <a href="#activity" data-view="activity" data-more><i data-ic="activity"></i><span>Activity</span></a>
        <a href="#settings" data-view="settings" data-more><i data-ic="settings"></i><span>Settings</span></a>
        <button type="button" class="nav-more" id="nav-more" data-pop aria-haspopup="menu"><i data-ic="more"></i><span>More</span></button>
      </nav>
      <div class="side-foot" id="limit"></div>
    </aside>
    <div class="content">
      <header class="topbar" id="topbar"></header>
      <div id="banner"></div>
      <main id="main"></main>
    </div>
  </div>

  <div id="modal" class="modal" hidden><div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
  <script src="/builder.js"></script>
  <script src="/calendar.js"></script>
  <script src="/insights.js"></script>
</body>
</html>
