services:
  app:
    build: .
    # Named so client instances (scripts/client.sh) run the same image.
    image: insta-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Meta webhooks for client accounts arrive here and are passed on to the client instances listed in this file.
      FORWARD_WEBHOOKS_FILE: /clients/forward.json
      # The Clients page (switch each client's tools) reads the client list and control keys from here.
      CLIENTS_FILE: /clients/clients.json
    volumes:
      - appdata:/data
      - ./clients/shared:/clients:ro
    expose:
      - "3000"
    # Hardening: read-only image, no new privileges, only the capabilities the entrypoint needs
    # to chown the volume and drop to the unprivileged user.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./clients/shared/caddy:/etc/caddy/clients:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  appdata:
  caddy_data:
  caddy_config:
